aid: matterworks
name: Matterworks
description: >-
  Matterworks is a Boston-based life-sciences AI company building foundation models for
  biochemical omics. Its Large Spectral Model is trained on billions of small-molecule,
  lipid, peptide, and protein mass-spectrometry spectra across millions of biological
  contexts, and its Pyxis platform turns raw omics data into quantitative, untargeted
  biochemical annotations and predictions used for asset and target discovery,
  mode-of-action elucidation, and life-science R&D pipeline decisions. Matterworks positions
  biochemical omics as explaining orders of magnitude more biological variation than
  sequence data alone. The product is accessed through the Pyxis web application
  (app.matterworks.ai, Auth0 sign-in); no public developer API, OpenAPI, SDK, or
  documentation surface is published at this time.
